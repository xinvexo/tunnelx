[package]
name = "tunnelx-watchdog"
version = "0.1.0"
edition = "2021"
description = "Cross-platform watchdog sidecar that supervises provider processes for TunnelX."
authors = ["xinvexo"]
license = "MIT"
repository = "https://github.com/xinvexo/tunnelx"

[[bin]]
name = "tunnelx-watchdog"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tunnelx-watchdog-protocol = { path = "../tunnelx-watchdog-protocol" }
reqwest = { version = "0.13", features = ["blocking", "json", "query", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_Networking_WinSock",
] }
