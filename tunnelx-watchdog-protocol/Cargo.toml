edition = "2021"
description = "Shared line-delimited JSON protocol types for TunnelX and its watchdog sidecar."
authors = ["xinvexo"]
license = "MIT"
repository = "https://github.com/xinvexo/tunnelx"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
